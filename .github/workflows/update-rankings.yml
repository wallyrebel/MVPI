name: Update MVPI rankings

on:
  workflow_dispatch:
  schedule:
    # 1:15 p.m. CST / 2:15 p.m. CDT every Tuesday, Friday, and Sunday.
    - cron: "15 19 * * 0,2,5"

permissions:
  contents: write

concurrency:
  group: update-mvpi-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Pull results and calculate rankings
        run: python calculate_volleyball.py

      - name: Validate rankings
        run: python -m pytest -q

      - name: Verify production build
        run: npm run build

      - name: Publish updated snapshot
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/volleyball/current.json data/volleyball/matches.json
          if git diff --cached --quiet; then
            echo "No ranking changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update volleyball rankings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The rankings and every team page are built from the JSON above, so the
      # site keeps serving stale data until a deploy runs. dist/ is already the
      # fresh build from the verify step.
      - name: Deploy updated rankings
        if: steps.publish.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so the new rankings were committed but not deployed. The live site will keep serving the previous build until someone runs 'npm run deploy'."
            exit 0
          fi
          npx wrangler deploy --config dist/server/wrangler.json
