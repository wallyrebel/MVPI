name: Update MVPI rankings

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Check the official source and tests without refreshing or publishing rankings"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mvpi/live.py'
      - 'calculate_volleyball.py'
      - 'tests/**'
      - '.github/workflows/update-rankings.yml'
  schedule:
    # 1:15 p.m. CST / 2:15 p.m. CDT every Tuesday, Friday, and Sunday.
    - cron: "15 19 * * 0,2,5"

permissions:
  contents: write

concurrency:
  group: update-mvpi-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate ranking engine and source handling
        run: python -m pytest -q

      - name: Validate official classification source without publishing
        if: github.event_name == 'push' || inputs.validate_only == true
        run: |
          python -c "from mvpi.live import fetch_teams; teams = fetch_teams(); print(f'Validated {len(teams)} official teams')"

      - name: Set up Node.js
        if: github.event_name != 'push' && inputs.validate_only != true
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        if: github.event_name != 'push' && inputs.validate_only != true
        run: npm ci

      - name: Pull results and calculate rankings
        if: github.event_name != 'push' && inputs.validate_only != true
        run: python calculate_volleyball.py

      - name: Verify production build
        if: github.event_name != 'push' && inputs.validate_only != true
        run: npm run build

      - name: Publish updated snapshot
        id: publish
        if: github.event_name != 'push' && inputs.validate_only != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/volleyball/current.json data/volleyball/matches.json
          if git diff --cached --quiet; then
            echo "No ranking changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update volleyball rankings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The rankings and every team page are built from the JSON above, so the
      # site keeps serving stale data until a deploy runs. dist/ is already the
      # fresh build from the verify step.
      - name: Deploy updated rankings
        if: steps.publish.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, so the new rankings were committed but not deployed. The live site will keep serving the previous build until someone runs 'npm run deploy'."
            exit 0
          fi
          npx wrangler deploy --config dist/server/wrangler.json

      - name: Retain official classification response diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-classification-response
          path: work/classifications/
          if-no-files-found: ignore
          retention-days: 14
